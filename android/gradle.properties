org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Low-memory VM tuning (non-secret): keep Gradle/Kotlin daemons small.
org.gradle.jvmargs=-Xmx1024m -Dfile.encoding=UTF-8
kotlin.daemon.jvm.options=-Xmx512m
org.gradle.workers.max=1
# This VM's filesystem breaks Gradle's daemon registry/file locks
# (daemon starts, then is "no longer found in the registry").
# Run builds in-process instead — slower to start, but reliable here.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
